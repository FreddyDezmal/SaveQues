name: CI

# Sprint 18 — Phase 6. No CI existed prior to this sprint (confirmed —
# .github/ didn't exist in the project). Fails fast on the cheapest checks
# first (lint/typecheck) before spending time on tests and a full build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
        env:
          # Sprint 18 fix: found by actually running `next lint` locally —
          # it loads next.config.js in full (not just the linter itself),
          # which throws on missing required env vars before linting even
          # starts. Without this, this job fails on every fresh checkout
          # for a reason that has nothing to do with actual lint findings.
          # Same placeholder-value reasoning as the build job below.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          CRON_SECRET: placeholder-cron-secret
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder-vapid-public
          VAPID_PRIVATE_KEY: placeholder-vapid-private
      - run: pnpm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:component

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          # Sprint 18 note: build-time env validation (next.config.js)
          # requires these to be present even for a CI build that never
          # deploys — using non-secret placeholder values here is
          # deliberate and safe (they're never used to reach a real
          # Supabase project in this job, only to satisfy next build's
          # own startup check). Real secrets are Vercel's job at deploy
          # time, not CI's.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          CRON_SECRET: placeholder-cron-secret
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder-vapid-public
          VAPID_PRIVATE_KEY: placeholder-vapid-private

  # Sprint 18 — Phase 6 explicitly lists Playwright/Lighthouse as
  # "if feasible." Scoped OUT of the required/blocking pipeline above and
  # kept as a separate, manually-triggered workflow (e2e.yml) rather than
  # wired in here — E2E tests need a real Supabase TEST project's
  # credentials as GitHub Actions secrets, which is an infrastructure
  # decision for you to make (creating and funding a dedicated test
  # project), not something safe to assume or fake with placeholders the
  # way the build-verification job above does. Making E2E a hard gate on
  # every PR before that exists would block all merges on a job that can
  # never pass. See e2e.yml and docs/DEVELOPMENT.md.
